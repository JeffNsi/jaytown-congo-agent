name: JayTown Congo Agent (hourly)

on:
  schedule:
    - cron: "0 * * * *"  # every hour, 24/7
  workflow_dispatch:  # manual trigger button

concurrency:
  group: jaytown-congo-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agent.py

      - name: Commit report back to repo
        run: |
          git config user.name "jaytown-agent"
          git config user.email "agent@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Hourly Congo brief $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
